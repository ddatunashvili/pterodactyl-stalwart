name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pterodactyl-stalwart
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build for test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stalwart-test:ci

      # Boot it the way Wings does: its uid, its dropped capabilities,
      # no-new-privileges, a tty, and a startup line prefixed the way the
      # Renode panel prefixes it. Nothing is pushed unless every protocol
      # answers and the administrator login works.
      - name: Boot test
        env:
          PW: Ci0Test0Passw0rdXyz
        run: |
          set -x
          mkdir -p /tmp/vol && sudo chown 988:988 /tmp/vol
          STARTUP=': renode_banner_begin; if [ -n "$RENODE_BANNER" ]; then printf "%s" "$RENODE_BANNER" | base64 -d 2>/dev/null || true; fi; : renode_banner_end; /usr/local/bin/stalwart --config /home/container/etc/config.json'
          docker run -d -t -i --name ci --user 988:988 \
            --cap-drop setpcap --cap-drop mknod --cap-drop audit_write --cap-drop net_raw \
            --cap-drop dac_override --cap-drop fowner --cap-drop fsetid --cap-drop net_bind_service \
            --cap-drop sys_chroot --cap-drop setfcap --security-opt no-new-privileges \
            --memory 1024m -v /tmp/vol:/home/container \
            -p 25724:25724 -p 25725:25725 -p 25726:25726 -p 25727:25727 -p 25728:25728 \
            -e MAIL_ADMIN_PASSWORD="$PW" -e MAIL_HOSTNAME=mail.ci.test \
            -e SERVER_PORT=25724 -e SUBMISSION_PORT=25725 -e SUBMISSIONS_PORT=25726 \
            -e IMAPS_PORT=25727 -e WEB_PORT=25728 \
            -e RENODE_BANNER="$(printf 'RENODE BANNER OK\n' | base64)" \
            -e STARTUP="$STARTUP" stalwart-test:ci
          ready() {
            for i in $(seq 1 90); do
              docker logs ci 2>&1 | grep -c 'Renode: Stalwart is ready' | grep -q "^$1$" && return 0
              docker inspect -f '{{.State.Running}}' ci | grep -q true || return 1
              sleep 2
            done
            return 1
          }
          ready 1 || { docker logs ci 2>&1 | tail -80; exit 1; }
          docker logs ci 2>&1 | tail -60
          docker logs ci 2>&1 | grep -q 'RENODE BANNER OK'

          # SMTP greets on the primary allocation
          timeout 10 bash -c 'exec 3<>/dev/tcp/127.0.0.1/25724; head -c 3 <&3' | tee /tmp/smtp.txt
          grep -q '^220' /tmp/smtp.txt
          # Submission answers too, and offers STARTTLS
          timeout 10 bash -c 'exec 3<>/dev/tcp/127.0.0.1/25725; read -r l <&3; echo "$l"; printf "EHLO ci\r\n" >&3; sleep 1; timeout 2 cat <&3' | tee /tmp/sub.txt
          grep -qi 'STARTTLS' /tmp/sub.txt
          # Implicit TLS on submissions and IMAPS
          echo | timeout 15 openssl s_client -connect 127.0.0.1:25726 -quiet 2>/dev/null | head -1 | tee /tmp/subs.txt
          grep -q '^220' /tmp/subs.txt
          echo | timeout 15 openssl s_client -connect 127.0.0.1:25727 -quiet 2>/dev/null | head -1 | tee /tmp/imaps.txt
          grep -q '^\* OK' /tmp/imaps.txt
          # Web: the administrator login works, a wrong password does not
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:$PW" http://127.0.0.1:25728/.well-known/jmap)
          echo "jmap with password: $code"; [ "$code" = 200 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:wrong-password" http://127.0.0.1:25728/.well-known/jmap)
          echo "jmap with wrong password: $code"; [ "$code" = 401 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:25728/healthz/live)
          echo "healthz: $code"; [ "$code" = 200 ]
          curl -s -o /dev/null -w 'admin page: %{http_code}\n' http://127.0.0.1:25728/admin

          # Clean stop on the panel's stop signal
          docker kill --signal INT ci
          for i in $(seq 1 30); do docker inspect -f '{{.State.Running}}' ci | grep -q false && break; sleep 1; done
          docker logs ci 2>&1 | tail -5
          docker inspect -f 'exit={{.State.ExitCode}} running={{.State.Running}}' ci | tee /dev/stderr | grep -q 'running=false'

          # Second start on the same volume: no setup pass, same login, same ports
          docker start ci
          ready 2 || { docker logs ci 2>&1 | tail -60; exit 1; }
          [ "$(docker logs ci 2>&1 | grep -c 'Renode: setting up listeners')" = 1 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:$PW" http://127.0.0.1:25728/.well-known/jmap)
          echo "jmap after restart: $code"; [ "$code" = 200 ]
          timeout 10 bash -c 'exec 3<>/dev/tcp/127.0.0.1/25724; head -c 3 <&3' | grep -q '^220'
          docker kill --signal INT ci

      # A server that cannot start must take the container down with it,
      # or Wings reports "starting" for ever.
      - name: Failure exits
        run: |
          mkdir -p /tmp/vol2 && sudo chown 988:988 /tmp/vol2
          docker run -d -t -i --name bad --user 988:988 -v /tmp/vol2:/home/container \
            -e MAIL_ADMIN_PASSWORD= -e STARTUP=/usr/local/bin/stalwart stalwart-test:ci
          for i in $(seq 1 30); do docker inspect -f '{{.State.Running}}' bad | grep -q false && break; sleep 1; done
          docker logs bad 2>&1 | tail -5
          docker inspect -f 'exit={{.State.ExitCode}} running={{.State.Running}}' bad | tee /dev/stderr | grep -q 'exit=1 running=false'

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
